<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLead AI - Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    SmartLead AI
</header>

<div class="container">

    <h1>Lead Dashboard</h1>

    <div class="card">

        <h2>Kayıtlı Lead'ler</h2>

        <button onclick="leadleriGetir()">Yenile</button>

        <table>
            <thead>
                <tr>
                    <th>Ad Soyad</th>
                    <th>Telefon</th>
                    <th>Mesaj</th>
                </tr>
            </thead>

            <tbody id="leadler">
                <tr>
                    <td colspan="3" class="empty">
                        Lead'ler yükleniyor...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

<script>

async function leadleriGetir() {

    const tablo = document.getElementById("leadler");

    try {

        const response = await fetch("/api/leads");

        const data = await response.json();

        if (!data.basari) {
            throw new Error(data.hata || "Lead'ler alınamadı.");
        }

        if (!data.leads || data.leads.length === 0) {

            tablo.innerHTML = `
                <tr>
                    <td colspan="3" class="empty">
                        Henüz kayıtlı lead yok.
                    </td>
                </tr>
            `;

            return;
        }

        tablo.innerHTML = "";

        data.leads.forEach(lead => {

            tablo.innerHTML += `
                <tr>
                    <td>${lead.isim || ""}</td>
                    <td>${lead.telefon || ""}</td>
                    <td>${lead.mesaj || ""}</td>
                </tr>
            `;

        });

    } catch (error) {

        tablo.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    Lead'ler yüklenirken hata oluştu.
                </td>
            </tr>
        `;

        console.error(error);
    }
}

leadleriGetir();

</script>

</body>
</html>
